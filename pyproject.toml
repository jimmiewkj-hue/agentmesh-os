[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop-hub"
version = "1.0.0"
description = "AgentMesh OS — 本地多 Agent 协同操作系统（用户主权型控制平面）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=41.0",
  "zstandard>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
agentmesh = "agentloop_hub.cli:main"
agentloop = "agentloop_hub.cli:main"

[tool.setuptools.packages.find]
include = ["agentloop_hub*"]

[tool.setuptools.package-data]
agentloop_hub = ["api/static/*.html", "api/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:asyncio"
